<div class="site-hero">
    {# Ferris with his cap is the tab's icon: one file for both, so the page asks for no other picture of him. #}
    <img src="/favicon.svg" alt="" width="176" height="176">
    <h1>{{ site.description }}</h1>
    <p>
        {% for item in site.hero %}
        <a href="{{ item.url }}">{{ item.name }}</a>
        {% endfor %}
    </p>
</div>
