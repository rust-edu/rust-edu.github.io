<h1>{{ page.title }}</h1>
<p class="news-feeds">Follow the news in a feed reader: <a href="/atom.xml">Atom</a></p>
<ul class="news-list">
    {% for post in page.pages %}
    <li>
        <time datetime="{{ post.date }}">{{ post.date_display }}</time>
        <a href="{{ post.url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
</ul>
