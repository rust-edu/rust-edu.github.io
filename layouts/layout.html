<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% if page.home %}{{ site.title }}: {{ site.description }}{% else %}{{ page.title }} - {{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <a class="site-logo" href="/">
            <img src="/rust-edu-banner.svg" alt="Rust Edu home" width="150" height="36">
        </a>
        <nav class="site-nav" aria-label="Main">
            <ul>
                {% for item in site.menu %}
                <li><a href="{{ item.url }}">{{ item.name }}</a></li>
                {% endfor %}
            </ul>
        </nav>
    </header>

    <main id="main">
        {{ content | safe }}
    </main>

    <footer class="site-footer">
        <p>Content licensed <a href="https://creativecommons.org/share-your-work/public-domain/cc0/">CC0</a>.
            Source on <a href="https://github.com/rust-edu/rust-edu.github.io">GitHub</a>.</p>
        <nav aria-label="More links">
            <ul>
                {% for item in site.footer %}
                <li><a href="{{ item.url }}">{{ item.name }}</a></li>
                {% endfor %}
            </ul>
        </nav>
    </footer>
</body>

</html>
