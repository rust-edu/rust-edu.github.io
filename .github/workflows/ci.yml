name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    # The steps are targets of the Makefile, so `make ci` runs the same checks on a laptop. The checks
    # run inside the pinned Docker image, so the runner only has to provide Docker and make.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Docker writes the build line by line, which is the form that the filter below reads.
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the guards, then format, lint and build in Docker, check the pages and test
        # Each error of the guards and of `edu check`, `file:line:col: error: …`, is also written as
        # an annotation, which GitHub shows on that line of the pull request. For example, this line
        # of the build stays in the log as it is:
        #   #18 0.057 content/_index.md:37:32: error: `/nope/` is not a page or file of the site
        # and this line follows it, which GitHub reads as a command and shows on line 37 of the page:
        #   ::error file=content/_index.md,line=37,col=32::`/nope/` is not a page or file of the site
        run: |
          # A pipe ends with the result of its last command, and `sed` always succeeds. With
          # `pipefail`, the step fails when `make ci` fails.
          set -o pipefail
          # `2>&1` sends the errors of `make ci` through the pipe too, since Docker writes its build
          # there. `sed -u` writes each line as it comes, so the log shows the build while it runs,
          # and `-E` allows `+` and `( )` in the patterns. `sed` runs the commands below on each line.
          make ci 2>&1 | sed -uE '
            # Print the line as it is, so the log holds all of the output.
            p
            # Docker starts each line of a step with the number of the step and its time, as in
            # "#18 0.057 ". Remove them, so that an error starts with the name of its file.
            s/^#[0-9]+ [0-9.]+ //
            # Stop here unless the line is an error with a file, a line and a column: "!d" deletes
            # every other line, which "p" has already printed. The name of a file has no space, so
            # the copy of the error in the summary of Docker, which follows a time, gives no second
            # annotation.
            /^[^: ]+:[0-9]+:[0-9]+: error: /!d
            # GitHub reads "%0A" in a command as a new line, and with it an error could start a
            # command of its own. Write each "%" as "%25", which GitHub reads as a plain "%".
            s/%/%25/g
            # Write the error as the command of GitHub for an annotation. `sed` prints what is left
            # of a line after its last command, so the error is in the log twice: as it was, and as
            # the command.
            s/^([^:]+):([0-9]+):([0-9]+): error: (.*)$/::error file=\1,line=\2,col=\3::\4/'
      # A preview for the reviewers of a pull request: the site with its drafts, as a download.
      - name: Build the site with its drafts
        run: make preview
      - name: Attach the site to the checks of the pull request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: preview/
          retention-days: 7
          if-no-files-found: error
