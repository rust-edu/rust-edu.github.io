name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    # The steps are targets of the Makefile, so `make ci` runs the same checks on a laptop. The checks
    # run inside the pinned Docker image, so the runner only has to provide Docker and make.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Docker writes the build line by line, which is the form that the filter below reads.
      BUILDKIT_PROGRESS: plain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the guards, then format, lint and build in Docker, check the pages and test
        # Each error of the guards and of `edu check`, `file:line:col: error: …` (in the build, after
        # its step and time), is also written as an annotation, which GitHub shows on that line of
        # the pull request.
        run: |
          set -o pipefail
          make ci 2>&1 | sed -uE '
            p
            s/^#[0-9]+ [0-9.]+ //
            /^[^: ]+:[0-9]+:[0-9]+: error: /!d
            s/%/%25/g
            s/^([^:]+):([0-9]+):([0-9]+): error: (.*)$/::error file=\1,line=\2,col=\3::\4/'
      # A preview for the reviewers of a pull request: the site with its drafts, as a download.
      - name: Build the site with its drafts
        run: make preview
      - name: Attach the site to the checks of the pull request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: preview/
          retention-days: 7
          if-no-files-found: error
