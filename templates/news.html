{% extends "base.html" %}

{% block title %}{{ section.title }}{% endblock title %}

{% block content %}
<h1>{{ section.title }}</h1>
<ul class="news-list">
    {% for post in section.pages %}
    <li>
        <a href="{{ post.path }}">{{ post.title }}</a>
        <time datetime="{{ post.date }}">{{ post.date | date(format="%b %e, %Y") }}</time>
    </li>
    {% endfor %}
</ul>
{% endblock content %}
