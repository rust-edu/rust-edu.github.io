# The URL the site is served at
base_url = "https://rust-edu.org"
title = "Rust Edu"
description = "Rust education in academia (and beyond)"

# The stylesheet is plain CSS: static/style.css
compile_sass = false

[markdown]
# Curl straight quotes and apostrophes
smart_punctuation = true

[link_checker]
internal_level = "error"
external_level = "warn"

[extra]
navbar = [
  { name = "Home", url = "/" },
  { name = "News", url = "/news/" },
  { name = "Zulip", url = "/zulip/" },
  { name = "Resources", url = "/resources/" },
]

external = [
  { name = "Rust Language Website", url = "https://rust-lang.org" },
  { name = "Official Rust Book", url = "https://doc.rust-lang.org/book/" }
]
